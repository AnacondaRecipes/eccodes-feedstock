{% set name = "eccodes" %}
{% set version = "2.47.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ecmwf/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 6318a6a1e296d6698bcd83719212cf630b9bb45c054723c22bbc449090ae0c0e
  patches:
    - fix-tests-path.patch

build:
  number: 0
  detect_binary_files_with_prefix: true

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}  # [not win]
    - cmake
    - git
    - diffutils  # [not win]
    - make       # [not win]
  host:
    - jasper    {{ jasper }}
    - zlib      {{ zlib }}
    - libpng    {{ libpng }}
    - libnetcdf {{ libnetcdf }}
    - libaec    {{ libaec }}
    - hdf5      {{ hdf5 }}

test:
  requires:
    - perl          # [not win]
    - msys2-bash       # [win]
    - msys2-findutils  # [win]
    - msys2-coreutils  # [win]
    - msys2-grep       # [win]
    - msys2-sed        # [win]
    - msys2-gawk       # [win]
    - msys2-diffutils  # [win]
    - msys2-perl       # [win]
  commands:
    - codes_info
    - ls $(codes_info -s)  # [not win]
    - ls $(codes_info -d)  # [not win]

about:
  home: https://confluence.ecmwf.int/display/ECC/ecCodes+Home
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: ECMWF ecCodes Copyright 2005- ECMWF.
  description: |
    ECMWF ecCodes Copyright 2005- ECMWF.
  dev_url: https://confluence.ecmwf.int/spaces/ECC/pages/45757960/Releases
  doc_url: https://confluence.ecmwf.int/spaces/ECC/pages/45748339/Documentation

extra:
  recipe-maintainers:
    - joobog
    - shahramn
    - kmuehlbauer
    - kynan
    - ocefpaf
    - pelson
    - StephanSiemen
    - dtip
    - iainrussell